name: Sync Tailscale ACL

on:
  push:
    branches: [main]
    paths:
      - 'config/tailscale-acl.json'

jobs:
  sync-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload ACL to Tailscale API
        run: |
          curl -X POST "https://api.tailscale.com/api/v2/tailnet/burningredfog.github/acl" \
            -H "Authorization: Bearer ${{ secrets.TAILSCALE_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data-binary @config/tailscale-acl.json
